<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inv.no</title>
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh;
      background: #000; overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* no-JS: the launcher cannot pick, so show the wordmark as static art */
    .fallback {
      margin: 0; padding: 2rem;
      font: clamp(4px, 1.1vw, 12px)/1 ui-monospace, Consolas, monospace;
      white-space: pre; color: #7dffc3;
      text-shadow: 0 0 8px rgba(125, 255, 195, .4);
    }
  </style>
</head>
<body>
  <noscript>
    <pre class="fallback">
~~~~~=====~ ==== ====    ++=       ++++*+  ***     ******
~~~~~=====~ ==== ====    ++=       ++++*+  **+    ********
~~~~~======~==== ===== +=++=       ++++**+ **+  *****  *****
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~ ======    =++++=         +++  **+**+  ***      ***
~~~~~===~   ====    =+++=     +++  +++  **+**+  *****+ *****
~~~~~===~   ===~     =+=      +++  +++     **+    ********
</pre>
  </noscript>

<script>
// inv.no is a rotating set of graphic experiments. Each one is a standalone
// page under experiments/ -- openable and tunable on its own -- and this
// launcher decides which one a visit gets.
//
// Order beats randomness here. A random pick repeats: with four experiments
// there is a 1-in-4 chance of seeing the same one twice running, and no
// guarantee of ever seeing all of them. So a visit ADVANCES through the list
// and the position rides in a session cookie -- you see every experiment once
// before any of them comes round again.
//
// The starting point is still random, so two visitors do not begin at the same
// place, and the cookie carries no expiry: closing the browser starts a fresh
// cycle rather than resuming a stale one.
const EXPERIMENTS = [
  { name: "ascii",    src: "experiments/ascii.html"    },
  { name: "monolith", src: "experiments/monolith.html" },
  { name: "emerge",   src: "experiments/emerge.html"   },
  { name: "rgb",      src: "experiments/rgb.html"      },
];

const COOKIE = "inv_x";

const params = new URLSearchParams(location.search);

function readPos() {
  const hit = document.cookie.split(";").map(c => c.trim())
    .find(c => c.indexOf(COOKIE + "=") === 0);
  if (!hit) return null;
  const n = parseInt(hit.slice(COOKIE.length + 1), 10);
  // A cookie left over from a shorter list must not pin the cycle out of range
  return Number.isInteger(n) && n >= 0 && n < EXPERIMENTS.length ? n : null;
}

function writePos(i) {
  // No Max-Age and no Expires is what makes this a session cookie: it lives in
  // memory and goes with the browser. Nothing reads it but this page, so Lax
  // is the right SameSite and there is nothing here worth a server round trip.
  document.cookie = COOKIE + "=" + i + "; path=/; SameSite=Lax";
}

function pick() {
  // ?x=<name> forces one, for linking and for testing a specific experiment.
  // It deliberately leaves the cycle where it was.
  const forced = params.get("x");
  if (forced) {
    const hit = EXPERIMENTS.find(e => e.name === forced);
    if (hit) return hit;
  }
  const last = readPos();
  const next = last === null
    ? Math.floor(Math.random() * EXPERIMENTS.length)   // first visit of a session
    : (last + 1) % EXPERIMENTS.length;
  writePos(next);
  return EXPERIMENTS[next];
}

const chosen = pick();

// Forward the query string through, so ?x=monolith&hud=1&q=medium reaches the
// experiment and its own knobs keep working from the top-level URL.
const forward = new URLSearchParams(params);
forward.delete("x");
const qs = forward.toString();

const frame = document.createElement("iframe");
frame.src = chosen.src + (qs ? "?" + qs : "");
frame.title = "inv.no";
frame.setAttribute("scrolling", "no");
document.body.appendChild(frame);

// The experiments listen for keys and drags, which only reach them once the
// iframe has focus. Hand it over so interaction works without a click first.
frame.addEventListener("load", () => { try { frame.contentWindow.focus(); } catch (e) {} });

document.documentElement.dataset.experiment = chosen.name;

// Telemetry. One pageview per visit, attributed to the experiment that was
// actually shown rather than all of them piling up under "/". GoatCounter
// sets no cookie and stores no identifier, so there is nothing here that
// needs a consent banner.
//
// It lives in the launcher rather than in the experiments: those run in an
// iframe, so a tag inside one would report the frame URL, and it would also
// fire every time an experiment is opened directly for tuning.
//
// ?hud and ?dev mean someone is tuning, not visiting, so those are not
// counted at all -- that holds even on a browser where the GoatCounter
// "ignore my own visits" flag has not been set, such as a phone.
const TUNING = params.has("hud") || params.has("dev");
window.goatcounter = TUNING ? { no_onload: true } : { path: "/" + chosen.name };
</script>
<script data-goatcounter="https://invno.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
