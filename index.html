<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inv.no</title>
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh;
      background: #000; overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* no-JS: the launcher cannot pick, so show the wordmark as static art */
    .fallback {
      margin: 0; padding: 2rem;
      font: clamp(4px, 1.1vw, 12px)/1 ui-monospace, Consolas, monospace;
      white-space: pre; color: #7dffc3;
      text-shadow: 0 0 8px rgba(125, 255, 195, .4);
    }
  </style>
</head>
<body>
  <noscript>
    <pre class="fallback">
~~~~~=====~ ==== ====    ++=       ++++*+  ***     ******
~~~~~=====~ ==== ====    ++=       ++++*+  **+    ********
~~~~~======~==== ===== +=++=       ++++**+ **+  *****  *****
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~ ======    =++++=         +++  **+**+  ***      ***
~~~~~===~   ====    =+++=     +++  +++  **+**+  *****+ *****
~~~~~===~   ===~     =+=      +++  +++     **+    ********
</pre>
  </noscript>

<script>
// inv.no is a rotating set of graphic experiments. Each one is a standalone
// page under experiments/ -- openable and tunable on its own -- and this
// launcher picks one per visit by weight.
//
// Weights are relative, not percentages, so adding an experiment does not mean
// recalculating the others. Currently: spinner 25%, ascii 75%.
const EXPERIMENTS = [
  { name: "ascii",   src: "experiments/ascii.html",   weight: 75 },
  { name: "spinner", src: "experiments/spinner.html", weight: 25 },
];

const params = new URLSearchParams(location.search);

function pick() {
  // ?x=<name> forces one, for linking and for testing a specific experiment
  const forced = params.get("x");
  if (forced) {
    const hit = EXPERIMENTS.find(e => e.name === forced);
    if (hit) return hit;
  }
  const total = EXPERIMENTS.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of EXPERIMENTS) {
    r -= e.weight;
    if (r < 0) return e;
  }
  return EXPERIMENTS[0];
}

const chosen = pick();

// Forward the query string through, so ?x=spinner&ev=0.4&px=140 reaches the
// experiment and its own knobs keep working from the top-level URL.
const forward = new URLSearchParams(params);
forward.delete("x");
const qs = forward.toString();

const frame = document.createElement("iframe");
frame.src = chosen.src + (qs ? "?" + qs : "");
frame.title = "inv.no";
frame.setAttribute("scrolling", "no");
document.body.appendChild(frame);

// The experiments listen for keys and drags, which only reach them once the
// iframe has focus. Hand it over so interaction works without a click first.
frame.addEventListener("load", () => { try { frame.contentWindow.focus(); } catch (e) {} });

document.documentElement.dataset.experiment = chosen.name;
</script>
</body>
</html>
