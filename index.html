<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inv.no</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <pre class="ch" id="ch-r"></pre>
    <pre class="ch" id="ch-g"></pre>
    <pre class="ch" id="ch-b"></pre>
  </div>

  <noscript>
    <pre class="fallback" id="fallback">
~~~~~=====~ ==== ====    ++=       ++++*+  ***     ******
~~~~~=====~ ==== ====    ++=       ++++*+  **+    ********
~~~~~======~==== ===== +=++=       ++++**+ **+  *****  *****
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~==~====  ==== +++=        +++ +*+ **+  ***      ***
~~~~~===~ ======    =++++=         +++  **+**+  ***      ***
~~~~~===~   ====    =+++=     +++  +++  **+**+  *****+ *****
~~~~~===~   ===~     =+=      +++  +++     **+    ********
                                                      **
    </pre>
  </noscript>

<script src="font.js"></script>
<script>
const DEPTH = 3;                      // extrusion layers each way
const RAMP  = "@#%x*+=~:-. ";

// "upper" or "lower" — press C to switch. ?case=lower in the URL also works.
let face = new URLSearchParams(location.search).get("case") === "lower" ? "lower" : "upper";
let geom = buildPoints(face, DEPTH);
let pts  = geom.pts;

const H = 22;             // character rows
const SY = 1.15;
const FOV = 90;
let W = 150, SX = 2.4;    // columns and x-scale — recomputed to fit the viewport

const chR = document.getElementById("ch-r");
const chG = document.getElementById("ch-g");
const chB = document.getElementById("ch-b");

// Pick a legible font size, measure the real character advance, then derive how
// many columns actually fit. Guessing the advance from font-size is what makes
// the grid overflow on narrow screens.
function fit() {
  const fs = Math.max(6, Math.min(13, innerWidth / 48));
  document.documentElement.style.setProperty("--fs", fs + "px");

  const probe = document.createElement("pre");
  probe.className = "ch";
  probe.style.cssText = "position:absolute;visibility:hidden;mix-blend-mode:normal";
  probe.textContent = "0".repeat(100);
  document.body.appendChild(probe);
  const advance = probe.getBoundingClientRect().width / 100;
  probe.remove();

  W = Math.max(60, Math.min(150, Math.floor((innerWidth - 2) / advance)));
  // baseSX holds the on-screen span constant across faces, so switching case
  // doesn't change how wide the banner sits
  SX = (W / 150) * geom.baseSX;
}

// `disp` is the lens-dispersion factor: each colour channel focuses slightly
// differently, so red projects a touch wider than blue. The divergence is nil
// at the centre and grows toward the edges, like a real lens.
function render(angle, disp) {
  const sin = Math.sin(angle), cos = Math.cos(angle);
  const chars = new Array(W * H).fill(" ");
  const zbuf  = new Array(W * H).fill(-Infinity);

  for (const p of pts) {
    const rx = p.x * cos + p.z * sin;
    const rz = -p.x * sin + p.z * cos;
    const tilt = Math.sin(angle * 0.5) * 0.22;
    const ry = p.y * Math.cos(tilt) - rz * Math.sin(tilt);
    const rz2 = p.y * Math.sin(tilt) + rz * Math.cos(tilt);

    const f = FOV / (FOV + rz2 + 25);
    const sx = Math.round(rx * SX * disp * f + W / 2);
    const sy = Math.round(ry * SY * disp * f + H / 2);
    if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;

    const i = sy * W + sx;
    if (-rz2 > zbuf[i]) {           // nearer wins
      zbuf[i] = -rz2;
      const t = (rz2 + 22) / 44;    // depth 0..1, 0 = nearest
      chars[i] = RAMP[Math.max(0, Math.min(RAMP.length - 1, Math.round(t * (RAMP.length - 1))))];
    }
  }

  // every row is padded to exactly W chars so all three channels have
  // identical box widths — without this they drift apart
  let out = "";
  for (let y = 0; y < H; y++) out += chars.slice(y * W, y * W + W).join("") + "\n";
  return out;
}

let angle = 0, speed = 0.016, paused = false;

function frame() {
  // pulse the aberration so it breathes instead of sitting static
  const a = 0.034 + Math.sin(angle * 0.7) * 0.020;
  // temporal split: red trails the rotation, blue leads it. The channels
  // disagree about where the object *is*, not just how wide it projects,
  // so the fringing swells as the banner turns.
  const lag = 0.085 + Math.sin(angle * 0.9) * 0.040;

  chR.textContent = render(angle - lag, 1 + a);
  chG.textContent = render(angle,       1);
  chB.textContent = render(angle + lag, 1 - a);

  // lateral split, opposite for r and b, with a slight vertical shear.
  // scaled off font size so the split stays proportional on small screens
  const px = a * 170 * (parseFloat(getComputedStyle(chR).fontSize) / 13);
  chR.style.transform = `translate(${ px.toFixed(2) }px, ${ (-px * 0.18).toFixed(2) }px)`;
  chB.style.transform = `translate(${ (-px).toFixed(2) }px, ${ (px * 0.18).toFixed(2) }px)`;

  if (!paused) angle += speed;
  requestAnimationFrame(frame);
}

fit();
frame();

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fit, 120);
});

addEventListener("click", () => { paused = !paused; });
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") speed += 0.006;
  if (e.key === "ArrowLeft")  speed -= 0.006;
  if (e.key === "c" || e.key === "C") {
    face = face === "upper" ? "lower" : "upper";
    geom = buildPoints(face, DEPTH);
    pts  = geom.pts;
    fit();
  }
});
</script>
</body>
</html>
